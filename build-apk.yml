# Builds the debug APK for the YTMusic for TV app (sideload build).
#
# Lesson from the Verse Garden builds: do NOT use
# android-actions/setup-android@v3 — it internally runs `sdkmanager tools`
# and the obsolete "tools" package no longer exists, so it fails. Use the
# runner's preinstalled SDK at /usr/local/lib/android/sdk + explicit
# sdkmanager calls instead.
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytm-tv-apk
          path: app/build/outputs/apk/debug/*.apk
